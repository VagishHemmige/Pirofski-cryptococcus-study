project:
  type: website
  output-dir: docs
  # Only the site's pages. Without this list Quarto also renders the root
  # .md files (analysis-plan.md, ARCHITECTURE.md, ...) as pages outside the
  # sidebar; they are shown through the Project documents pages instead.
  render:
    - index.qmd
    - 404.qmd
    - quarto/**
  # Cleared outputs shown on the Results page
  resources:
    - tables/*.html
    - figures/*.png

author:
  - name: Vagish Hemmige
    affiliations:
      - MAHV

# Citations: [@key] from references.bib, in AMA style (numbered superscripts,
# reference list at the end of each page). The CSL file is the official
# citation-style-language style, kept in the repository so renders don't
# depend on a download.
bibliography: references.bib
csl: american-medical-association.csl

website:
  title: "Antibody profiles in transplant cryptococcosis"
  site-url: https://vagishhemmige.github.io/Pirofski-cryptococcus-study
  repo-url: https://github.com/VagishHemmige/Pirofski-cryptococcus-study
  repo-branch: master
  repo-actions: [edit, issue]
  page-navigation: true

  # Each kind of page has one icon, coloured in styles.css: book = background,
  # diagram-3 = study design and methods, laptop = R code, clipboard-data = results, file-earmark-ruled = project
  # documents.
  sidebar:
    style: docked
    # Every section starts open, including those inside Code
    collapse-level: 3
    search: true
    contents:
      - href: index.qmd
        text: Home
        icon: house

      - section: Background
        contents:
          - href: quarto/background.qmd
            text: Clinical background
            icon: book
          - href: quarto/methodological_background.qmd
            text: Methodological background
            icon: book

      - href: quarto/study_methods.qmd
        text: Study design and methods
        icon: diagram-3

      - section: Code
        contents:
          - section: Setup and helper functions
            contents:
              - href: quarto/setup.qmd
                text: Setup
                icon: laptop
              - href: quarto/functions.qmd
                text: Functions
                icon: laptop

          # One numbered page per definitive script, in the order main.R sources them.
          - section: Data processing and analysis
            contents:
              - href: quarto/import_clean.qmd
                text: 1. Import and clean data
                icon: laptop
              - href: quarto/modeling.qmd
                text: 2. Regression, ROC and cutpoints
                icon: laptop
              - href: quarto/pca.qmd
                text: 3. Principal component analysis
                icon: laptop

          - section: Tables and figures
            contents:
              - href: quarto/tables.qmd
                text: Tables
                icon: laptop
              - href: quarto/figures.qmd
                text: Figures
                icon: laptop

      - section: Results
        contents:
          - href: quarto/results.qmd
            text: Results
            icon: clipboard-data

      - section: Project documents
        contents:
          - href: quarto/analysis-plan.qmd
            text: Analysis plan
            icon: file-earmark-ruled
          - href: quarto/architecture.qmd
            text: Architecture
            icon: file-earmark-ruled
          - href: quarto/agents.qmd
            text: AGENTS.md
            icon: file-earmark-ruled
          - href: quarto/repository-blueprint.qmd
            text: Repository blueprint
            icon: file-earmark-ruled

      - href: quarto/about.qmd
        text: About
        icon: info-circle

# Each kind of content has one callout, in its kind's colour: Rcode for code,
# Results for results, Pending for provisional content (added by
# quarto/_pending.lua). Yellow is kept for provisional content only.
custom-callout:
  Rcode:
    icon: true
    icon-symbol: "💻"
    color: "#d63384"
  Results:
    icon: true
    icon-symbol: "📊"
    color: "#198754"
  Pending:
    icon: true
    icon-symbol: "⏳"
    color: "#f0c400"

filters:
  # Yellow marks for provisional content, and their Pending callout. It runs
  # before custom-callout, which turns the callout it adds into a styled box.
  - quarto/_pending.lua
  - custom-callout
  - issue-comments

# Readers can highlight text and comment; the relay files each comment as a
# GitHub issue in this repository, worked out from the page's address. Same
# relay as the other project sites.
issue-comments:
  endpoint: https://script.google.com/macros/s/AKfycbyE8fNBvy3vfuAnuQqdjpCTR8i2zYI-KSvGzhkGlQRYevI1I6auqq9H-mIk2yrXCaIROA/exec
  contact: mailto:vagish.hemmige@gmail.com
  # Readers enter a shared passcode before posting, as on the other sites
  passcode: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    page-layout: full
    code-summary: "Click to show/hide R Code"

# The site shows code; it never runs the analysis. Only these chunks set
# eval: true: the hidden read_chunk() imports, the Architecture page's chunk
# that reads ARCHITECTURE.md as text, and the Results page's show_table()
# helper, which reads the saved files in tables/.
execute:
  eval: false
